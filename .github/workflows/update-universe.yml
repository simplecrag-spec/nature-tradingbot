name: Update Stock Universe

on:
  workflow_dispatch:
  schedule:
    # Weekly -- which tickers exist barely changes day to day, unlike the
    # live weather run, so there's no need to hammer NASDAQ Trader /
    # Wikipedia / OpenFIGI every 6 hours. Sundays at 04:10 UTC.
    - cron: "10 4 * * 0"

permissions:
  contents: write

jobs:
  update-universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-universe.txt

      - name: Build universe
        env:
          # Optional. If unset, update_universe.py just skips the OpenFIGI
          # validation step and keeps the unvalidated list -- it never
          # fails the run.
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python update_universe.py

      - name: Commit updated universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh stock universe"
            git push
          fi
