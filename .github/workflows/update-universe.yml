name: Update Stock Universe

on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * 0"

permissions:
  contents: write

jobs:
  update-universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-universe.txt
      - name: Run universe updater
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python update_universe.py
      - name: Commit updated stock cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.csv
          git diff --staged --quiet || git commit -m "Update stock universe cache"
          git push
