name: Nature Trading Bot

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, UTC. We will tune this after the first successful test.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  nature-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Nature engine
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python main.py
