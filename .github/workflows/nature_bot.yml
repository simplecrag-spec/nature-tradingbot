name: Nature Trading Bot

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, UTC. Reads the cached data/stocks.csv -- it does not
    # rebuild the universe itself. See update-universe.yml for that.
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  nature-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Nature engine
        run: python main.py
